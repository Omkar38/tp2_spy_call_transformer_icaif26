[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tp2rr2-spy-ml"
version = "0.1.0"
description = "EOD SPY TP2/RR2 violation detection, labeling, and ML strategy selection."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "optuna>=4.0",
  "joblib>=1.3",
  "torch>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]
